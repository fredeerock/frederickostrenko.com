  fullbio:  >
    Frederick “Derick” Ostrenko, is a media artist and Assistant Professor at Louisiana State University (LSU). He holds a joint-appointment in the Digital Art concentration at the School of Art and the Cultural Computing research group at the Center for Computation and Technology (CCT). Derick creates physical and virtual systems that examine the intersections of media, culture, and technology. He employs custom hardware and software that use various interfaces such as mobile applications, brain waves, generative visualizations, video processing, animation, and games. His research focuses on pushing art and technology to reveal hidden networks between people by creating structures for innovative forms of expression and discovery. Derick received his MFA in Digital+Media from the Rhode Island School of Design.
    Most recently Derick has shown his work at venues including the International Symposium of Electronic Art (Albuquerque, NM), New York University (New York, NY), Fountain Art Fair (Miami, FL), Buffalo Media Resources (Buffalo, NY), the Archie Bray Foundation (Helena, MT), the Polk Museum of Art (Lakeland, FL), NWEAMO (San Diego, CA), and the at the National Academy (New York, NY).
    In conjunction with his artistic practice, Ostrenko has also worked professionally in exhibit fabrication, video production, 3D modeling, and web development. As the current area head for Digital Art at the LSU School of Art, Derick teaches classes in animation, creative coding, 3D graphics, interactive art, and video production.
  shortbio: >
    Frederick “Derick” Ostrenko is a media artist, researcher, and educator whose work explores the intersections of art, technology, and culture. He serves as an Associate Professor at Louisiana State University, holding a joint appointment in the Digital Art concentration at the School of Art and the Cultural Computing research group at the Center for Computation and Technology (CCT). As the current area head for Digital Art, Derick teaches courses in animation, creative coding, 3D graphics, interactive art, and video production, guiding students through innovative, interdisciplinary workflows that bridge physical and virtual systems. His artistic practice spans custom hardware and software, integrating interfaces such as mobile applications, brain waves, generative visualizations, video processing, game design, and virtual production to uncover hidden networks between people and technology. Derick’s research pushes the boundaries of immersive media, digital twins, and real-time systems, fostering new forms of expression and discovery. His work has been exhibited at venues including the International Symposium of Electronic Art, New York University, Buffalo Media Resources, the Archie Bray Foundation, the Polk Museum of Art, NWEAMO, and the Currents New Media Festival. A longtime active member of SIGGRAPH, Derick served for several years on the SIGGRAPH Digital Arts Community Committee, where he helped organize talks, panels, exhibitions, and year-long programming that connects global communities of artists and technologists. He has worked on successful grants from NASA, the National Science Foundation (NSF), and Louisiana Economic Development (LED), produced large-scale interactive art commissions, and curated exhibitions on digital art, including a sonic art exhibition for the New Interfaces for Musical Expression (NIME) conference. He holds an MFA in Digital+Media from the Rhode Island School of Design.

